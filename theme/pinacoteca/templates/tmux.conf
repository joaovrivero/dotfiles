# Pinacoteca tmux status. Palette and provenance: theme/pinacoteca/colors.toml
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg={{fg_dim}},bg={{bg1}}"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg={{bg0}},bg={{gold}},bold] #S #[fg={{gold}},bg={{bg1}}] "
set -g status-right "#{?client_prefix,#[fg={{red}}]● ,}#[fg={{fg_dim}}]#{b:pane_current_path} #[fg={{bg3}}]│ #[fg={{fg}}]%H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg={{comment}}] #I #[fg={{fg_dim}}]#W "
set -g window-status-current-format "#[fg={{gold}},bold] #I #[fg={{fg_bright}},bold]#W#[fg={{gold}}]#{?window_zoomed_flag, ⌕,} "
set -g window-status-activity-style "fg={{gold}}"
set -g window-status-bell-style "fg={{red}}"
set -g pane-border-style "fg={{bg3}}"
set -g pane-active-border-style "fg={{gold}}"
set -g pane-border-lines single
set -g popup-border-style "fg={{bg3}}"
set -g popup-border-lines rounded
set -g message-style "fg={{fg}},bg={{bg2}}"
set -g message-command-style "fg={{gold}},bg={{bg2}}"
set -g mode-style "fg={{fg_bright}},bg={{bg3}}"
set -g copy-mode-match-style "fg={{bg0}},bg={{gold}}"
set -g copy-mode-current-match-style "fg={{bg0}},bg={{orange}}"
set -g clock-mode-colour "{{gold}}"
set -g display-panes-active-colour "{{gold}}"
set -g display-panes-colour "{{bg3}}"
