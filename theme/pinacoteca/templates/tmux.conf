# Pinacoteca tmux status, laid out after janoamaral/tokyo-night-tmux.
# Palette and provenance: theme/pinacoteca/colors.toml
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg={{fg_dim}},bg={{bg0}}"
set -g status-left-length 80
set -g status-right-length 150

# Session block: gold at rest, red while the prefix is held, then an orange tag in copy mode.
set -g status-left "#[fg={{bg0}}]#[bg=#{?client_prefix,{{red}},{{gold}}}]#[bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[nodim]#S #[default]#{?pane_in_mode,#[fg={{bg0}}]#[bg={{orange}}]#[bold] copy #[default],} "

# Tabs: terminal (or ssh) icon, number and name, then zoom, pane count and the last-tab marker.
set -g window-status-separator ""
set -g window-status-format "#[fg={{comment}}] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg={{fg_dim}}]#I #W#[fg={{comment}}]#{?window_zoomed_flag, 󰊓,}#{?#{>:#{window_panes},1}, #{s/0/󰎣/:#{s/1/󰎦/:#{s/2/󰎩/:#{s/3/󰎬/:#{s/4/󰎮/:#{s/5/󰎰/:#{s/6/󰎵/:#{s/7/󰎸/:#{s/8/󰎻/:#{s/9/󰎾/:window_panes}}}}}}}}}},}#[fg={{gold}}]#{?window_last_flag, 󰁯,} "
set -g window-status-current-format "#[fg={{aqua}}]#[bg={{bg2}}] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg={{fg}}]#[bold]#I #W#[nobold]#[fg={{fg_dim}}]#{?window_zoomed_flag, 󰊓,}#{?#{>:#{window_panes},1}, #{s/0/󰎣/:#{s/1/󰎦/:#{s/2/󰎩/:#{s/3/󰎬/:#{s/4/󰎮/:#{s/5/󰎰/:#{s/6/󰎵/:#{s/7/󰎸/:#{s/8/󰎻/:#{s/9/󰎾/:window_panes}}}}}}}}}},} #[default]"
set -g window-status-activity-style "fg={{gold}}"
set -g window-status-bell-style "fg={{red}}"

# Right: working directory, git and its remote (pinacoteca-git.sh), then the machine name.
set -g status-right "#[fg={{gold}}]░  #[fg={{fg_dim}}]#{=/-48/…:#{s|^$HOME|~|:pane_current_path}} #(sh ~/.config/tmux/pinacoteca-git.sh #{q:pane_current_path})#[fg={{fg}}]#[bg={{bg2}}] 󰌢 #h "

set -g pane-border-style "fg={{bg3}}"
set -g pane-active-border-style "fg={{gold}}"
set -g pane-border-lines heavy
set -g pane-border-format "#{?pane_active,#[fg={{gold}}],#[fg={{comment}}]} #{pane_index} #{pane_current_command} "
set -g popup-border-style "fg={{gold}}"
set -g popup-border-lines rounded
set -g message-style "fg={{bg0}},bg={{gold}}"
set -g message-command-style "fg={{gold}},bg={{bg2}}"
set -g mode-style "fg={{aqua}},bg={{bg2}}"
set -g copy-mode-match-style "fg={{bg0}},bg={{gold}}"
set -g copy-mode-current-match-style "fg={{bg0}},bg={{orange}}"
set -g clock-mode-colour "{{gold}}"
set -g display-panes-active-colour "{{gold}}"
set -g display-panes-colour "{{bg3}}"
