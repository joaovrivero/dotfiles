# Every file that carries Pinacoteca colours, and the template it is rendered from.
# Paths are relative to the repository root; $HOMEPAGE ports are skipped unless
# the HOMEPAGE environment variable points at the homepage checkout.

[[port]]
template = "alacritty.toml"
output = ".config/alacritty/pinacoteca.toml"

[[port]]
template = "ghostty"
output = ".config/ghostty/themes/pinacoteca"

[[port]]
template = "btop.theme"
output = ".config/btop/themes/pinacoteca.theme"

[[port]]
template = "tmux.conf"
output = ".config/tmux/pinacoteca.conf"

[[port]]
template = "tmux-git.sh"
output = ".config/tmux/pinacoteca-git.sh"

[[port]]
template = "windows-terminal.json"
output = "theme/pinacoteca/windows-terminal.json"

[[port]]
template = "t3code.json"
output = "theme/pinacoteca/t3code.json"

[[port]]
template = "zed.json"
output = ".config/zed/themes/pinacoteca.json"

[[port]]
template = "neovim.lua"
output = ".config/nvim/colors/pinacoteca.lua"

[[port]]
template = "wezterm.lua"
output = ".config/wezterm/wezterm.lua"
mode = "block"

[[port]]
template = "starship.toml"
output = ".config/starship.toml"
mode = "block"

[[port]]
template = "fzf.zsh"
output = "home/.zshrc"
mode = "block"

[[port]]
template = "psreadline.ps1"
output = ".config/powershell/Microsoft.PowerShell_profile.ps1"
mode = "block"

[[port]]
template = "herdr.toml"
output = ".config/herdr/config.toml"
mode = "block"

[[port]]
template = "vscode.json"
output = ".config/Code/User/settings.json"
mode = "json"

[[port]]
template = "spicetify-color.ini"
output = ".config/spicetify/Themes/Pinacoteca/color.ini"

[[port]]
template = "homepage-theme.css"
output = "$HOMEPAGE/src/styles/theme.css"

[[port]]
template = "homepage-shiki.mjs"
output = "$HOMEPAGE/src/lib/shiki/pinacoteca.mjs"

[[port]]
template = "homepage-palette.astro"
output = "$HOMEPAGE/src/components/mdx/Palette.astro"
mode = "block"
