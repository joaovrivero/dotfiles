set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g set-clipboard on
set -g display-time 2000
set -g set-titles on
set -g set-titles-string "#h · #S · #W"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Drop the old prefix-less chords so a reload does not leave them stealing
# Shift/Alt from the terminal (WezTerm uses Alt+hjkl and Alt+Shift+hjkl).
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down
unbind -n S-Left
unbind -n S-Right
unbind -n M-H
unbind -n M-L

# Drop leftover key tables from older configs, then the defaults we replace.
unbind -aq -T tabs
unbind -aq -T panes
unbind t
unbind p
unbind n
unbind c
unbind w
unbind '"'
unbind %
unbind &
unbind o
unbind q
unbind x
unbind z
unbind [
unbind ]
unbind Space
unbind 0

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi
set -g pane-border-status off
set-hook -g after-split-window "set -w pane-border-status top"
set-hook -g window-layout-changed 'if-shell -F "#{<=:#{window_panes},1}" "set -w pane-border-status off" "set -w pane-border-status top"'

# Prefix is Ctrl-Space. One key after it does the thing — no hidden modes.
bind -N "Show keys" ? display-popup -w 52 -h 18 -T " keys " -E "printf '%s\n' \
    ' prefix is Ctrl-Space' \
    '' \
    ' t  new tab          n  next tab' \
    ' b  previous tab     w  pick tab' \
    ' X  close tab        ,  rename tab' \
    ' 1-9  go to tab' \
    '' \
    ' p  new pane right   v  new pane down' \
    ' hjkl  move pane     HJKL  resize' \
    ' x  close pane       z  zoom' \
    '' \
    ' s  sessions         d  detach' \
    ' c  copy mode        r  reload' \
    '' \
    ' press any key' \
    ; head -c 1 >/dev/null"

bind -N "New tab" t new-window -c "#{pane_current_path}"
bind -N "Next tab" n next-window
bind -N "Previous tab" b previous-window
bind -N "Pick tab" w choose-window
bind -N "Close tab" X confirm-before -p "close tab #W?" kill-window
bind -N "Rename tab" , command-prompt -I "#W" "rename-window -- '%%'"

bind -N "New pane right" p split-window -h -c "#{pane_current_path}"
bind -N "New pane down" v split-window -v -c "#{pane_current_path}"
bind -N "Close pane" x confirm-before -p "close pane?" kill-pane
bind -N "Zoom pane" z resize-pane -Z
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R
bind -N "Resize left" -r H resize-pane -L 5
bind -N "Resize down" -r J resize-pane -D 5
bind -N "Resize up" -r K resize-pane -U 5
bind -N "Resize right" -r L resize-pane -R 5

bind -N "Sessions" s choose-tree -Zs
bind -N "Detach" d detach-client
bind -N "Copy mode" c copy-mode
bind -N "Reload config" r {
    source-file -q ~/.tmux.conf
    source-file -q ~/.config/tmux/tmux.conf
    source-file -q ~/.config/tmux/shared.conf
    display-message "tmux reloaded"
}

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pinacoteca status line. Home Manager appends the same file; -q keeps Nix quiet.
source-file -q ~/.config/tmux/pinacoteca.conf
# Machine-specific settings that should not live in the repository.
source-file -q ~/.tmux.local.conf
