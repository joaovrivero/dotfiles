# Pinacoteca tmux status, laid out after janoamaral/tokyo-night-tmux.
# Palette and provenance: theme/pinacoteca/colors.toml
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=#b19a80,bg=#18130e"
set -g status-left-length 80
set -g status-right-length 150

# Session block: gold at rest, red while the prefix is held, then an orange tag in copy mode.
set -g status-left "#[fg=#18130e]#[bg=#{?client_prefix,#d67066,#d7a447}]#[bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[nodim]#S #[default]#{?pane_in_mode,#[fg=#18130e]#[bg=#d77f47]#[bold] copy #[default],} "

# Tabs: terminal (or ssh) icon, number and name, then zoom, pane count and the last-tab marker.
set -g window-status-separator ""
set -g window-status-format "#[fg=#7d6b59] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg=#b19a80]#I #W#[fg=#7d6b59]#{?window_zoomed_flag, 󰊓,}#{?#{>:#{window_panes},1}, #{s/0/󰎣/:#{s/1/󰎦/:#{s/2/󰎩/:#{s/3/󰎬/:#{s/4/󰎮/:#{s/5/󰎰/:#{s/6/󰎵/:#{s/7/󰎸/:#{s/8/󰎻/:#{s/9/󰎾/:window_panes}}}}}}}}}},}#[fg=#d7a447]#{?window_last_flag, 󰁯,} "
set -g window-status-current-format "#[fg=#6cabab]#[bg=#2e2822] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg=#e6ccaf]#[bold]#I #W#[nobold]#[fg=#b19a80]#{?window_zoomed_flag, 󰊓,}#{?#{>:#{window_panes},1}, #{s/0/󰎣/:#{s/1/󰎦/:#{s/2/󰎩/:#{s/3/󰎬/:#{s/4/󰎮/:#{s/5/󰎰/:#{s/6/󰎵/:#{s/7/󰎸/:#{s/8/󰎻/:#{s/9/󰎾/:window_panes}}}}}}}}}},} #[default]"
set -g window-status-activity-style "fg=#d7a447"
set -g window-status-bell-style "fg=#d67066"

# Right: working directory, git and its remote (pinacoteca-git.sh), then the machine name.
set -g status-right "#[fg=#d7a447]░  #[fg=#b19a80]#{=/-48/…:#{s|^$HOME|~|:pane_current_path}} #(sh ~/.config/tmux/pinacoteca-git.sh #{q:pane_current_path})#[fg=#e6ccaf]#[bg=#2e2822] 󰌢 #h "

set -g pane-border-style "fg=#453b32"
set -g pane-active-border-style "fg=#d7a447"
set -g pane-border-lines heavy
set -g pane-border-format "#{?pane_active,#[fg=#d7a447],#[fg=#7d6b59]} #{pane_index} #{pane_current_command} "
set -g popup-border-style "fg=#d7a447"
set -g popup-border-lines rounded
set -g message-style "fg=#18130e,bg=#d7a447"
set -g message-command-style "fg=#d7a447,bg=#2e2822"
set -g mode-style "fg=#6cabab,bg=#2e2822"
set -g copy-mode-match-style "fg=#18130e,bg=#d7a447"
set -g copy-mode-current-match-style "fg=#18130e,bg=#d77f47"
set -g clock-mode-colour "#d7a447"
set -g display-panes-active-colour "#d7a447"
set -g display-panes-colour "#453b32"
