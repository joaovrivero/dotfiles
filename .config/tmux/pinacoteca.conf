# Pinacoteca tmux status. Palette and provenance: theme/pinacoteca/colors.toml
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=#b19a80,bg=#211c17"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#18130e,bg=#d7a447,bold] #S #[fg=#d7a447,bg=#211c17] "
set -g status-right "#{?client_prefix,#[fg=#d67066]● ,}#[fg=#b19a80]#{b:pane_current_path} #[fg=#453b32]│ #[fg=#e6ccaf]%H:%M "
set -g window-status-separator ""
set -g window-status-format "#[fg=#7d6b59] #I #[fg=#b19a80]#W "
set -g window-status-current-format "#[fg=#d7a447,bold] #I #[fg=#f7e5cf,bold]#W#[fg=#d7a447]#{?window_zoomed_flag, ⌕,} "
set -g window-status-activity-style "fg=#d7a447"
set -g window-status-bell-style "fg=#d67066"
set -g pane-border-style "fg=#453b32"
set -g pane-active-border-style "fg=#d7a447"
set -g pane-border-lines single
set -g popup-border-style "fg=#453b32"
set -g popup-border-lines rounded
set -g message-style "fg=#e6ccaf,bg=#2e2822"
set -g message-command-style "fg=#d7a447,bg=#2e2822"
set -g mode-style "fg=#f7e5cf,bg=#453b32"
set -g copy-mode-match-style "fg=#18130e,bg=#d7a447"
set -g copy-mode-current-match-style "fg=#18130e,bg=#d77f47"
set -g clock-mode-colour "#d7a447"
set -g display-panes-active-colour "#d7a447"
set -g display-panes-colour "#453b32"
